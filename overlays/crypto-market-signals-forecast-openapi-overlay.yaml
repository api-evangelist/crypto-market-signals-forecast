overlay: 1.0.0
info:
  title: API Evangelist enhancements for Crypto Market Signals & Forecast
  version: 1.0.0
extends: openapi/crypto-market-signals-forecast-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-profile: https://apis.io/provider/crypto-market-signals-forecast
      x-apievangelist-payment-model: x402-pay-per-call
      x-apievangelist-agent-surfaces:
        agent_card: /.well-known/agent-card.json
        mcp_endpoint: /mcp
        llms_txt: /llms.txt
  - target: $.components
    update:
      securitySchemes:
        x402:
          type: x402
          description: >-
            HTTP 402 payment challenge; pay USDC on Base (eip155:8453) and retry with the
            PAYMENT-SIGNATURE header. Documented by API Evangelist — the source contract
            declares no securitySchemes because access is settled per-call via x402.
  - target: $.paths['/api/kronos/forecast'].get
    update:
      x-apievangelist-note: >-
        The calibrated 80% range (range_80, ~0.80 empirical coverage) is the validated
        product; directional_bias is supporting context, ~51% standalone accuracy per
        the provider's own status note.
